# nginx для ИТ-портала: http://it-portal — портал ИТ-отдела, http://helpdesk — сайт заявок.
# Если в сети другие имена — замените it-portal / helpdesk в строках server_name ниже.
#
# Установка (командная строка от имени администратора):
#   1. taskkill /f /im nginx.exe                 — остановить ВСЕ запущенные nginx
#   2. copy /y C:\it-portal\scripts\nginx.conf C:\nginx\conf\nginx.conf
#   3. cd /d C:\nginx  и  nginx -t              — должно быть «syntax is ok» и путь C:\nginx/conf/nginx.conf
#   4. start nginx                               (или: Start-ScheduledTask -TaskName 'nginx')
# После правки этого файла: cd /d C:\nginx  и  nginx -s reload
worker_processes  1;

events { worker_connections 1024; }

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # Документы до 50 МБ, импорт из Excel до 40 МБ, вложения в заявки до 10 МБ
    client_max_body_size 60m;
    proxy_read_timeout   300s;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ИТ-портал (главная, инвентарь, документы, задачи, обработка заявок):
    #   http://it-portal  и полное имя вида http://it-portal.<домен>
    server {
        listen      80;
        server_name it-portal it-portal.*;
        location / { proxy_pass http://127.0.0.1:3000; }
    }

    # Сайт заявок для сотрудников предприятия:
    #   http://helpdesk  и  http://helpdesk.<домен>  (нужна такая запись в DNS или hosts)
    server {
        listen      80;
        server_name helpdesk helpdesk.*;
        location / { proxy_pass http://127.0.0.1:3100; }
    }

    # Обращение по IP или по любому другому имени — сайт заявок
    server {
        listen      80 default_server;
        server_name _;
        location / { proxy_pass http://127.0.0.1:3100; }
    }

    # ---------------- HTTPS (по желанию) ----------------
    # Нужен сертификат внутреннего центра сертификации на оба имени.
    # Раскомментируйте блоки ниже, а в блоках на порту 80 замените proxy_pass на
    #     return 301 https://$host$request_uri;
    # В .env портала: COOKIE_SECURE=true, PORTAL_URL и HELPDESK_URL с https://
    #
    # server {
    #     listen      443 ssl;
    #     server_name it-portal it-portal.*;
    #     ssl_certificate     C:/nginx/certs/portal.crt;
    #     ssl_certificate_key C:/nginx/certs/portal.key;
    #     location / { proxy_pass http://127.0.0.1:3000; }
    # }
    # server {
    #     listen      443 ssl;
    #     server_name helpdesk helpdesk.*;
    #     ssl_certificate     C:/nginx/certs/portal.crt;
    #     ssl_certificate_key C:/nginx/certs/portal.key;
    #     location / { proxy_pass http://127.0.0.1:3100; }
    # }
}
