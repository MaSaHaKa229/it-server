# nginx для ИТ-портала: разные адреса для портала ИТ-отдела и сайта заявок.
# Скопируйте в C:\nginx\conf\nginx.conf и замените имена it.company.local / helpdesk.company.local на свои.
# Проверка: nginx -t    Применить изменения: nginx -s reload
worker_processes  1;

events { worker_connections 1024; }

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # Документы до 50 МБ, импорт из Excel до 40 МБ, вложения в заявки до 10 МБ
    client_max_body_size 60m;
    proxy_read_timeout   300s;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ИТ-портал (главная, инвентарь, документы, задачи, обработка заявок)
    server {
        listen      80;
        server_name it.company.local;
        location / { proxy_pass http://127.0.0.1:3000; }
    }

    # Сайт заявок для сотрудников предприятия
    server {
        listen      80;
        server_name helpdesk.company.local;
        location / { proxy_pass http://127.0.0.1:3100; }
    }

    # Обращение по IP или неизвестному имени — на сайт заявок
    server {
        listen      80 default_server;
        server_name _;
        return 302 http://helpdesk.company.local$request_uri;
    }

    # ---------------- HTTPS (по желанию) ----------------
    # Нужен сертификат внутреннего центра сертификации на оба имени.
    # Раскомментируйте блоки ниже, а в блоках на порту 80 замените proxy_pass на
    #     return 301 https://$host$request_uri;
    # В .env портала: COOKIE_SECURE=true, PORTAL_URL и HELPDESK_URL с https://
    #
    # server {
    #     listen      443 ssl;
    #     server_name it.company.local;
    #     ssl_certificate     C:/nginx/certs/portal.crt;
    #     ssl_certificate_key C:/nginx/certs/portal.key;
    #     location / { proxy_pass http://127.0.0.1:3000; }
    # }
    # server {
    #     listen      443 ssl;
    #     server_name helpdesk.company.local;
    #     ssl_certificate     C:/nginx/certs/portal.crt;
    #     ssl_certificate_key C:/nginx/certs/portal.key;
    #     location / { proxy_pass http://127.0.0.1:3100; }
    # }
}
