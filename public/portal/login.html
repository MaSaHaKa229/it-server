<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход — ИТ-портал</title>
  <script src="/shared/prefs.js"></script>
  <link rel="icon" href="/portal/favicon.svg">
  <link rel="stylesheet" href="/shared/theme.css">
  <link rel="stylesheet" href="/shared/portal.css">
  <script type="module" src="/portal/login.js"></script>
</head>
<body>
  <div class="login-page">
    <div class="login-brand"><span class="brand-logo">IT</span> ИТ-портал</div>
    <div class="muted" data-brand-company style="display:none;text-align:center;margin:-8px 0 12px"></div>
    <div class="login-card">
      <h1>Вход в систему</h1>
      <form id="form" class="stack" style="gap:12px">
        <div id="err" class="error-box hidden"></div>
        <label class="field"><span>Логин или e-mail</span><input type="text" name="username" autocomplete="username" required autofocus></label>
        <label class="field"><span>Пароль</span><input type="password" name="password" autocomplete="current-password" required></label>
        <button class="btn primary" type="submit">Войти</button>
      </form>
    </div>
    <p class="muted small" style="margin-top:24px">ИТ-инвентарь · Документы · Задачи · Заявки</p>
    <p class="small" id="hd"></p>
  </div>
</body>
</html>
